name: Build APK

on:
  push:
    tags:
      - "v*"
      - "[0-9]+.*"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Optional existing release tag version, without v (for example 1.1.2)"
        required: false
        type: string

permissions:
  contents: write

env:
  LOADER_REPO: higashitaniyume/CesiumLoader
  # 恢复已经部署过的旧版缓存时仍需保留旧版对应的产物。
  PAYLOAD_TAG: payload
  # 固定随包加载器版本：发行版不能因为上游又发了新版就悄悄换掉 SDK 与内置模组。
  # 要升级加载器时改这里（并单独验证一次），不要依赖"取最新"。
  LOADER_VERSION: "4.1.1"
  # 1.1.2 起使用独立发行签名；后续版本必须沿用，避免意外换签。
  RELEASE_CERT_SHA256: "7cdb0644cd2bc4370152643950dde7b8cbf99ba4f770e094e9ecb775ca392bcc"

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_version && format('v{0}', inputs.release_version) || github.ref }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          requested="${{ inputs.release_version }}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] || [ -n "$requested" ]; then
            name="${requested:-${GITHUB_REF_NAME#v}}"
            [[ "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid release version"; exit 1; }
            echo "tag=v$name" >> "$GITHUB_OUTPUT"
            # 版本号直接决定版本码，不再混入 run_number：
            # major.minor.patch 各段按两位拼接（1.1.2 -> 10102），保证单调递增且可复现。
            IFS='.' read -r major minor patch <<< "$name"
            code=$(printf '%d%02d%02d' "${major:-0}" "${minor:-0}" "${patch:-0}")
          else
            name="0.0.0-dev.${GITHUB_RUN_NUMBER}"
            code=$((1000 + GITHUB_RUN_NUMBER))
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "version=$name / $code"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install SDK platform
        shell: bash
        run: |
          set -uo pipefail
          # 运行器自带 Android SDK 与 cmdline-tools，只是 sdkmanager 不在 PATH 上，
          # 而且 setup-android 会去装已被移除的 "tools" 包，所以这里直接找 sdkmanager。
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdkmanager="$(find "$sdk" -name sdkmanager -type f | head -n 1)"
          test -n "$sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          # 平台包名带小版本号：API 37 的包是 platforms;android-37.0
          "$sdkmanager" --install "platform-tools" "platforms;android-37.0"
          "$sdkmanager" --install "build-tools;37.0.0" || "$sdkmanager" --install "build-tools;36.0.0"
          ls "$sdk/platforms"
          ls "$sdk/build-tools"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build the managed bootstrap
        run: dotnet build loader/managed/CesiumLoader.Android.Bootstrap -c Release --nologo

      - name: Build the local cache editor
        run: python3 loader/tools/CacheAssemblyPatcher/build-assets.py --output app/src/main/assets/cesium/patcher

      - name: Prepare verified channel compatibility references
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.5.0 --repo Aperfish/CesiumLoader-Android-Direct --pattern 'CesiumLoader-Android-ModPack-0.5.0.apk' --dir channel-reference
          python3 installer/prepare-channel-references.py --apk channel-reference/CesiumLoader-Android-ModPack-0.5.0.apk

      - name: Resolve the loader release
        id: loader
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${LOADER_VERSION}"
          tag="modloader-${version}"
          gh release view "$tag" --repo "$LOADER_REPO" > /dev/null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p loaderpkg
          gh release download "$tag" --repo "$LOADER_REPO" \
            --pattern "cesium-loader-${version}.zip" --dir loaderpkg
          echo "10e1641348bbb977cc62bbddba65acd96011a9abfe74d3eac94d9d003382248c  loaderpkg/cesium-loader-${version}.zip" | sha256sum --check
          unzip -q "loaderpkg/cesium-loader-${version}.zip" -d loaderpkg/unpacked
          echo "zip=$PWD/loaderpkg/cesium-loader-${version}.zip" >> "$GITHUB_OUTPUT"
          echo "sdk=$PWD/loaderpkg/unpacked/AstralParty_ModLoader/sdk/CesiumLoader.SDK.dll" >> "$GITHUB_OUTPUT"
          ls -l loaderpkg/unpacked/AstralParty_ModLoader/sdk
          echo "加载器 $version"

      - name: Build the bundled Android overlay
        shell: bash
        env:
          LOADER_TAG: ${{ steps.loader.outputs.tag }}
          LOADER_SDK: ${{ steps.loader.outputs.sdk }}
        run: |
          set -euo pipefail
          mkdir -p build/overlay-game-refs
          base="https://raw.githubusercontent.com/$LOADER_REPO/$LOADER_TAG/refs/game"
          curl -fsSL "$base/sources.json" -o build/overlay-game-refs/sources.json
          # 按清单取全部程序集：卡面模组还要 UniTask 与 Google.Protobuf.Runtime，
          # 只取两个核心程序集会让 CardSkinMod 编译失败。
          while IFS= read -r file; do
            curl -fsSL "$base/$file" -o "build/overlay-game-refs/$file"
          done < <(python3 -c "import json; print('\n'.join(json.load(open('build/overlay-game-refs/sources.json', encoding='utf-8'))['assemblies']))")
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('build/overlay-game-refs')
          hashes = json.loads((root / 'sources.json').read_text(encoding='utf-8'))['assemblies']
          for name, expected in hashes.items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == expected, name
          PY
          python3 mods/build.py --refs build/overlay-game-refs --sdk "$LOADER_SDK"

      - name: Fetch the injected game assembly
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p payload
          gh release download "$PAYLOAD_TAG" --repo "${{ github.repository }}" \
            --pattern "AstralParty.Runtime.injected.dll" --dir payload
          ls -l payload

      - name: Prepare verified offline recovery
        run: python3 installer/prepare-recovery.py --download

      - name: Prepare release keystore
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ASPATOYS_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64}" ]; then
            mkdir -p "$RUNNER_TEMP/signing"
            printf '%s' "${KEYSTORE_B64}" | base64 -d > "$RUNNER_TEMP/signing/release.keystore"
            echo "keystore=$RUNNER_TEMP/signing/release.keystore" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "使用仓库配置的发行密钥库"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            if [ "${GITHUB_REF_TYPE}" = "tag" ] || [ -n "${{ inputs.release_version }}" ]; then
              echo "::error::缺少发行签名：仓库未配置 ASPATOYS_KEYSTORE_BASE64 等 secrets，tag 发行必须使用正式密钥签名，拒绝用调试密钥发布。"
              exit 1
            fi
            echo "未配置发行密钥库：本次只产出调试签名的构建产物，不用于发行。"
          fi

      - name: Build and test
        shell: bash
        env:
          ASPATOYS_KEYSTORE: ${{ steps.signing.outputs.keystore }}
          ASPATOYS_KEYSTORE_PASSWORD: ${{ secrets.ASPATOYS_KEYSTORE_PASSWORD }}
          ASPATOYS_KEY_ALIAS: ${{ secrets.ASPATOYS_KEY_ALIAS }}
          ASPATOYS_KEY_PASSWORD: ${{ secrets.ASPATOYS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            task=":app:assembleRelease"
            out="app/build/outputs/apk/release/app-release.apk"
          else
            task=":app:assembleDebug"
            out="app/build/outputs/apk/debug/app-debug.apk"
          fi
          ./gradlew --no-daemon --console=plain \
            --no-configuration-cache \
            -PappVersionName="${{ steps.version.outputs.name }}" \
            -PappVersionCode="${{ steps.version.outputs.code }}" \
            -PcesiumReleaseZip="${{ steps.loader.outputs.zip }}" \
            -PcesiumSdkDll="${{ steps.loader.outputs.sdk }}" \
            -PcesiumBootstrapDll="$PWD/loader/managed/CesiumLoader.Android.Bootstrap/bin/Release/netstandard2.0/CesiumLoader.Android.Bootstrap.dll" \
            -PcesiumInjectedDll="$PWD/payload/AstralParty.Runtime.injected.dll" \
            :app:testDebugUnitTest "$task"
          CESIUM_BUNDLE="$PWD/app/src/main/assets/cesium/recovery/original.bundle" \
          CESIUM_PATCHED_DLL="$PWD/app/src/main/assets/cesium/AstralParty.Runtime.injected.dll" \
          CESIUM_REBUILD_BUNDLE="$PWD/app/src/main/assets/cesium/recovery/original.bundle" \
          CESIUM_REBUILD_DLL="$PWD/app/src/main/assets/cesium/AstralParty.Runtime.injected.dll" \
          CESIUM_REBUILD_EXPECT_SHA256="37fc6d8576529a501c9a3aa0bef25ad70ad13881c0b811f9d245d434eac57991" \
            ./gradlew --no-daemon --console=plain --no-configuration-cache :cesiumcore:testDebugUnitTest
          echo "out=$out" >> "$GITHUB_ENV"

      - name: Show bundled loader version
        shell: bash
        run: cat app/src/main/assets/cesium/loader.json

      - name: Stage the managed loader payload
        shell: bash
        run: |
          set -euo pipefail
          assets="app/src/main/assets/cesium"
          files=(
            "bootstrap/CesiumLoader.Android.Bootstrap.dll"
            "sdk/CesiumLoader.SDK.dll"
            "CesiumAndroidApi.dll"
          )
          for file in "${files[@]}"; do
            test -f "$assets/$file" || { echo "::error::assets/cesium 里缺少 $file"; exit 1; }
          done
          if [ -f "$assets/loader.json" ]; then
            files+=("loader.json")
          fi
          managed="cesium-loader-android-managed-${{ steps.version.outputs.name }}.zip"
          repo_root="$PWD"
          # 只带托管部分，不带整个 APK：下游（比如 iOS 工具）取引导 DLL / SDK 时直接下这个小包，
          # 不用再解压 37 MB 的 APK。布局与 APK 里的 assets/cesium 一致。
          ( cd "$assets" && zip -q -r "$repo_root/$managed" "${files[@]}" )
          sha256sum "$managed" | awk '{print $1}' > "$managed.sha256"
          unzip -l "$managed"
          cat "$managed.sha256"

      - name: Name the APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          cp "$out" "aspatoys-${{ steps.version.outputs.name }}.apk"
          sha256sum "aspatoys-${{ steps.version.outputs.name }}.apk" | awk '{print $1}' \
            > "aspatoys-${{ steps.version.outputs.name }}.apk.sha256"
          cat "aspatoys-${{ steps.version.outputs.name }}.apk.sha256"
          python3 tools/write-update-manifest.py --version "${{ steps.version.outputs.name }}" \
            --apk "aspatoys-${{ steps.version.outputs.name }}.apk" \
            --managed "cesium-loader-android-managed-${{ steps.version.outputs.name }}.zip" \
            --out version.json
          cp docs/signing/production-certificate.pem aspatoys-signing-certificate.pem
          cp docs/signing/production-public-key.pem aspatoys-signing-public-key.pem
          ls -l aspatoys-*.apk* cesium-loader-android-managed-*.zip*
          cat version.json

      - name: Verify signature
        if: steps.signing.outputs.signed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          apksigner="$(find "$sdk" -name apksigner -type f | sort | tail -n 1)"
          "$apksigner" verify --print-certs "aspatoys-${{ steps.version.outputs.name }}.apk" | tee "$RUNNER_TEMP/apk-certificate.txt"
          actual="$(sed -n 's/^.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-certificate.txt" | tr '[:upper:]' '[:lower:]' | sort -u)"
          test "$actual" = "$RELEASE_CERT_SHA256" || {
            echo "::error::APK 证书与 1.1.2 起固定使用的发行证书不一致，拒绝发布。"
            exit 1
          }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aspatoys-${{ steps.version.outputs.name }}
          path: |
            aspatoys-${{ steps.version.outputs.name }}.apk
            aspatoys-${{ steps.version.outputs.name }}.apk.sha256
            cesium-loader-android-managed-${{ steps.version.outputs.name }}.zip
            cesium-loader-android-managed-${{ steps.version.outputs.name }}.zip.sha256
            aspatoys-signing-certificate.pem
            aspatoys-signing-public-key.pem
            version.json
          if-no-files-found: error

      - name: Publish release
        if: (github.ref_type == 'tag' || inputs.release_version != '') && steps.signing.outputs.signed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          apk="aspatoys-${{ steps.version.outputs.name }}.apk"
          managed="cesium-loader-android-managed-${{ steps.version.outputs.name }}.zip"
          assets=("$apk" "$apk.sha256" "$managed" "$managed.sha256"
                  "aspatoys-signing-certificate.pem" "aspatoys-signing-public-key.pem" "version.json")
          # 已存在的发行版一律不覆盖：历史上人工上传过资产，工作流后跑不能把它们替换掉。
          if gh release view "$tag" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "发行版 $tag 已存在，跳过创建"
            if gh release view "$tag" --repo "${{ github.repository }}" --json assets \
              --jq '.assets[].name' | grep -Fxq "$apk"; then
              echo "资产 $apk 已存在，保持原样"
              exit 0
            fi
            gh release upload "$tag" "${assets[@]}" \
              --repo "${{ github.repository }}"
          else
            notes_args=()
            if [ -f "docs/release-notes/${{ steps.version.outputs.name }}.md" ]; then
              notes_args=(--notes-file "docs/release-notes/${{ steps.version.outputs.name }}.md")
            else
              notes_args=(--generate-notes)
            fi
            gh release create "$tag" "${assets[@]}" \
              --repo "${{ github.repository }}" \
              --title "Astral Party Toys Android ${{ steps.version.outputs.name }}" \
              "${notes_args[@]}" \
              --verify-tag \
              --latest
          fi
