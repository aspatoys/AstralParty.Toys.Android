name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  LOADER_REPO: higashitaniyume/CesiumLoader
  # 与当前游戏热更版本绑定的注入产物放在这个发行版里，游戏更新后替换它即可。
  PAYLOAD_TAG: payload

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          echo "version=$name"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install SDK platform
        shell: bash
        run: |
          set -euo pipefail
          # 运行器自带 Android SDK 与 cmdline-tools，只是 sdkmanager 不在 PATH 上，
          # 而且 setup-android 会去装已被移除的 "tools" 包，所以这里直接找 sdkmanager。
          sdkmanager="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -name sdkmanager -type f | head -n 1)"
          test -n "$sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "platform-tools" "platforms;android-37" "build-tools;37.0.0"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build the managed bootstrap
        run: dotnet build loader/managed/CesiumLoader.Android.Bootstrap -c Release --nologo

      - name: Resolve the loader release
        id: loader
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.loader_tag }}"
          if [ -z "$tag" ]; then
            tag="$(gh api "repos/$LOADER_REPO/releases/latest" --jq .tag_name)"
          fi
          version="${tag#modloader-}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p loaderpkg
          gh release download "$tag" --repo "$LOADER_REPO" \
            --pattern "cesium-loader-${version}.zip" --dir loaderpkg
          echo "zip=$PWD/loaderpkg/cesium-loader-${version}.zip" >> "$GITHUB_OUTPUT"
          echo "加载器 $version"

      - name: Fetch the injected game assembly
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p payload
          url="${{ inputs.injected_url }}"
          if [ -n "$url" ]; then
            curl -fsSL "$url" -o payload/AstralParty.Runtime.injected.dll
          else
            gh release download "$PAYLOAD_TAG" --repo "${{ github.repository }}" \
              --pattern "AstralParty.Runtime.injected.dll" --dir payload
          fi
          ls -l payload

      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain \
            -PappVersionName="${{ steps.version.outputs.name }}" \
            -PappVersionCode="${{ steps.version.outputs.code }}" \
            -PcesiumReleaseZip="${{ steps.loader.outputs.zip }}" \
            -PcesiumSdkDll="$PWD/loaderpkg/AstralParty_ModLoader/sdk/CesiumLoader.SDK.dll" \
            -PcesiumBootstrapDll="$PWD/loader/managed/CesiumLoader.Android.Bootstrap/bin/Release/netstandard2.0/CesiumLoader.Android.Bootstrap.dll" \
            -PcesiumInjectedDll="$PWD/payload/AstralParty.Runtime.injected.dll" \
            :app:testDebugUnitTest :app:assembleDebug

      - name: Show bundled loader version
        shell: bash
        run: cat app/src/main/assets/cesium/loader.json

      - name: Name the APK
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk \
             "aspatoys-${{ steps.version.outputs.name }}.apk"
          ls -l aspatoys-*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aspatoys-${{ steps.version.outputs.name }}
          path: aspatoys-${{ steps.version.outputs.name }}.apk
          if-no-files-found: error

      - name: Publish release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes=$(printf '内置加载器：`%s`\n\n- 安装前需在设备上运行 Shizuku 并授权\n- 首次使用请在「加载器」页点「安装加载器」\n- 已装模组与市场可在应用内管理\n' "${{ steps.loader.outputs.version }}")
          gh release create "$GITHUB_REF_NAME" "aspatoys-${{ steps.version.outputs.name }}.apk" \
            --repo "${{ github.repository }}" \
            --title "Astral Party Toys Android ${{ steps.version.outputs.name }}" \
            --notes "$notes" \
            --latest
